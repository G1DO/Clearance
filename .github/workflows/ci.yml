name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - run: python -m unittest discover -s tests -v

  agent-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - run: bash contracts/agent-v1/verify.sh
      - name: Preserve compatibility matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-v1-compatibility
          path: |
            controller/target/agent-wire-contract/
            controller/target/surefire-reports/
          if-no-files-found: error
          retention-days: 30

  agent-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
      - name: Vet and race-check agent runtime
        working-directory: agent
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - name: Five-agent, five-minute hygiene soak
        working-directory: agent
        env:
          AGENT_SOAK: '1'
        run: go test -race -run '^TestDaemonHygieneSoak$' -count=1 -timeout=7m -v ./...
      - name: Preserve hygiene profiles and counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-hygiene-soak
          path: agent/target/hygiene-soak/
          if-no-files-found: error
          retention-days: 30

  java:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clearance
          POSTGRES_USER: clearance
          POSTGRES_PASSWORD: clearance
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U clearance -d clearance" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - run: cd controller && ./mvnw -B -ntp test
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
      - name: Agent integration against controller and PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: '5544'
          PGUSER: clearance
          PGPASSWORD: clearance
          PGDATABASE: clearance
        run: |
          cg="/sys/fs/cgroup/clearance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo mkdir "$cg" "$cg/agent"
          sudo chown "$(id -u):$(id -g)" "$cg" "$cg/cgroup.procs" "$cg/cgroup.threads" "$cg/cgroup.subtree_control"
          trap 'sudo rmdir "$cg/agent" "$cg"' EXIT
          # Move only a disposable verification shell under the delegation.
          bash -s -- "$cg" <<'VERIFY'
          set -euo pipefail
          sudo sh -c 'echo "$1" > "$2/agent/cgroup.procs"' -- "$$" "$1"
          export AGENT_CGROUP_TEST_ROOT="$1" CLEARANCE_CGROUP_ROOT="$1"
          bash agent/verify-containment.sh
          bash agent/verify-integration.sh
          VERIFY
      - name: Preserve agent integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-controller-integration
          path: |
            controller/target/agent-integration/
            controller/target/pitr-drill/
            agent/target/linux-containment/
          if-no-files-found: error
          retention-days: 30

  pitr-physical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Install PostgreSQL client for pitr script
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Physical PITR F14 drill on isolated postgres-pitr:5545
        run: bash scripts/pitr-physical-drill.sh
      # No extra logic-only gates on :5545 here: the drill already runs
      # PitrPhysicalPostRestoreIntegrationTest twice on the physical timeline
      # (OS-process RecoveryBootRunner boots + claim/stale/reconcile/cleanup).
      # Rerunning RecoveryGenerationIntegrationTest / PitrRewindDrillIntegrationTest
      # on :5545 would do their own logic-only rewinds and clobber physical evidence;
      # they run on :5544 in the java job.
      - name: Preserve physical PITR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitr-physical
          path: |
            controller/target/pitr-physical/run.*/
            controller/target/pitr-drill/
            controller/target/surefire-reports/
          if-no-files-found: error
          retention-days: 30
