name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - run: python -m unittest discover -s tests -v

  agent-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: bash contracts/agent-v1/verify.sh
      - name: Preserve compatibility matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-v1-compatibility
          path: |
            controller/target/agent-wire-contract/
            controller/target/surefire-reports/
          if-no-files-found: error
          retention-days: 30

  agent-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: Vet and race-check agent runtime
        working-directory: agent
        run: |
          go vet ./...
          go test -race ./...
      - name: Five-agent, five-minute hygiene soak
        working-directory: agent
        env:
          AGENT_SOAK: '1'
        run: go test -race -run '^TestDaemonHygieneSoak$' -count=1 -timeout=7m -v ./...
      - name: Preserve hygiene profiles and counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-hygiene-soak
          path: agent/target/hygiene-soak/
          if-no-files-found: error
          retention-days: 30

  java:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clearance
          POSTGRES_USER: clearance
          POSTGRES_PASSWORD: clearance
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U clearance -d clearance" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: cd controller && ./mvnw -B -ntp test
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: Agent integration against controller and PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: '5544'
          PGUSER: clearance
          PGPASSWORD: clearance
          PGDATABASE: clearance
        run: bash agent/verify-integration.sh
      - name: Preserve agent integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-controller-integration
          path: controller/target/agent-integration/
          if-no-files-found: error
          retention-days: 30
