name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - run: python -m unittest discover -s tests -v

  java:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clearance
          POSTGRES_USER: clearance
          POSTGRES_PASSWORD: clearance
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U clearance -d clearance" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: cd controller && chmod +x mvnw && ./mvnw -B -ntp test
