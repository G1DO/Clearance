services:
  postgres:
    image: postgres:17-alpine
    container_name: clearance-postgres
    environment:
      POSTGRES_DB: clearance
      POSTGRES_USER: clearance
      POSTGRES_PASSWORD: clearance
    ports:
      - "5544:5432"
    volumes:
      - clearance-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearance -d clearance"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  clearance-pgdata:
